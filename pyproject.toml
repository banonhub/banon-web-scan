[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "banon-web-scanner"
version = "1.0.0"
description = "Autonomous Selenium-powered QA security testing framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Banon Web Scanner contributors" }]
keywords = [
    "security",
    "qa",
    "selenium",
    "scanner",
    "web",
    "testing",
    "owasp",
    "pentest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx[http2]==0.28.1",
    "selenium==4.45.0",
    "webdriver-manager==4.1.2",
]

[project.urls]
Homepage = "https://github.com/banonhub/banon-web-scan"
Repository = "https://github.com/banonhub/banon-web-scan"
Issues = "https://github.com/banonhub/banon-web-scan/issues"

[project.scripts]
banon-web-scan = "scanner:main"
banon-web-scanner = "scanner:main"

[tool.setuptools]
py-modules = ["scanner"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "plugins*"]

[tool.setuptools.package-data]
data = ["*.json", "*.txt"]
